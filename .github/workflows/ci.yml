name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @autonomos/web lint
      - run: pnpm test

  integration:
    name: Database, RLS and end-to-end
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Supabase
        run: pnpm db:start
      - name: Write local env
        run: |
          STATUS=$(npx supabase status -o json)
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$STATUS" | jq -r .API_URL)"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(echo "$STATUS" | jq -r .ANON_KEY)"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$STATUS" | jq -r .SERVICE_ROLE_KEY)"
            echo "NEXT_PUBLIC_APP_URL=http://127.0.0.1:3100"
          } > .env.local
      - name: Integration tests (RLS, run store)
        run: pnpm --filter @autonomos/db test:integration
      - name: Build web
        run: pnpm --filter @autonomos/web build
      - name: Install Playwright browser
        run: pnpm --filter @autonomos/web exec playwright install --with-deps chromium
      - name: End-to-end demo loop
        run: pnpm --filter @autonomos/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results
